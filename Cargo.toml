[package]
name = "the-man"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
base64 = "0.22.1"
bincode = "1.3.3"
bytes = { version = "1.9.0", features = ["serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
ciborium = "0.2.2"
ed25519 = { version = "2.2.3", features = ["serde", "serde_bytes"] }
futures-lite = "2.5.0"
futures-util = "0.3.31"
iroh = "0.30.0"
iroh-blobs = { version = "0.30.0", features = ["rpc"] }
iroh-gossip = { version = "0.30.1", features = ["rpc"] }
serde = { version = "1.0.217", features = ["derive"] }
tokio = { version = "1.43.0", features = ["bytes", "fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
