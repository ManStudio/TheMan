[workspace]
members = ["crates/*"]

[lib]
crate-type = ["dylib"]

[package]
name = "the-man"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[features]

[dependencies]
gui-deps = {path = "crates/gui-deps"}
serde = { version = "1.0.217", features = ["derive"] }
pipewire = "0.8.0"
bincode = {version = "2.0.1", features = ["serde"]}
