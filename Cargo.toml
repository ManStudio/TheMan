[workspace]
members = ["crates/*"]
resolver = "3"

[package]
name = "the-man"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[features]

[workspace.dependencies]
base64 = "0.22.1"
bytes = { version = "1.10.0", features = ["serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
ciborium = "0.2.2"
ed25519 = { version = "2.2.3", features = ["serde", "serde_bytes"] }
futures-util = "0.3.31"
iroh = "0.35"
iroh-blobs = { version = "0.35", features = ["rpc"] }
iroh-gossip = { version = "0.35", features = ["rpc"] }
media-man = { path = "crates/media-man", features = [
  "codec-opus",
  "codec-raw",
  "codec-hevc",
] }
rand = "0.8"
thiserror = "2.0.11"
tokio = { version = "1.44.2", features = [
  "bytes",
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = { version = "0.31" }
anyhow = "1"
egui_tiles = "0.12.0"
zbus = "5.5.0"
ashpd = "0.11.0"
pipewire = { version = "0.8.0" }
bincode = { version = "2.0.1", features = ["serde"] }

rsmpeg = { version = "0.15.2" }

[dependencies]
base64 = { workspace = true }
tokio = { workspace = true }
iroh = { workspace = true }
iroh-blobs = { workspace = true }
iroh-gossip = { workspace = true }
media-man = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
eframe = { workspace = true }
egui_tiles = { workspace = true }
ed25519 = { workspace = true }
futures-util = { workspace = true }
ciborium = { workspace = true }
bytes = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
bincode = { workspace = true }

serde = { version = "1.0.217", features = ["derive"] }
platform = { path = "crates/platform" }
