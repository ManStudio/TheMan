[package]
name = "gui-deps"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[dependencies]
base64 = "0.22.1"
bytes = { version = "1.10.0", features = ["serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
ciborium = "0.2.2"
ed25519 = { version = "2.2.3", features = ["serde", "serde_bytes"] }
futures-util = "0.3.31"
iroh = "0.34"
iroh-blobs = { version = "0.34", features = ["rpc"] }
iroh-gossip = { version = "0.34", features = ["rpc"] }
media-man = { path = "../media-man", features = ["codec-opus"] }
rand = "0.8"
thiserror = "2.0.11"
tokio = { version = "1.44.2", features = ["bytes", "fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = {version = "0.31" }
anyhow = "1"
egui_tiles = "0.12.0"
zbus = "5.5.0"
ashpd = "0.11.0"
